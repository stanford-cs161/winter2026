<div class="staffer">
  {% if page.photo %}
  <img class="staffer-image" src="{{ site.baseurl }}{{ page.subpath }}{{ page.photo }}" alt="">
  {% else %}
  <img class="staffer-image" src="{{ site.baseurl }}/assets/anon.png" alt="">
  {% endif %}
  <div>
    <h3 class="staffer-name">
      {% if page.website %}
      <a href="{{ page.website }}">{{ page.name }}</a>
      {% else %}
      {{ page.name }}
      {% endif %}
    </h3>
    {% if page.email %}
    <p><a href="mailto:{{ page.email }}">{{ page.email }}</a></p>
    {% endif %}
    {{ content }}
  </div>
</div>
